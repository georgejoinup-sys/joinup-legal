<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none';">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2048%2048'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='hsl(152,75%25,55%25)'/%3E%3Cstop%20offset='.5'%20stop-color='hsl(168,70%25,50%25)'/%3E%3Cstop%20offset='1'%20stop-color='hsl(190,75%25,60%25)'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath%20fill='url(%23g)'%20d='M24%203C33.4%203%2041%2010.6%2041%2020c0%209.8-10.4%2019.3-15.3%2023.2a2.7%202.7%200%200%201-3.4%200C17.4%2039.3%207%2029.8%207%2020%207%2010.6%2014.6%203%2024%203Z'/%3E%3Ccircle%20cx='24'%20cy='20'%20r='6.5'%20fill='hsl(220,25%25,7%25)'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Open a JoinUp invite in the app.">
<title>JoinUp — Open your invite</title>
<style>
  :root {
    --bg: hsl(0, 0%, 100%); --fg: hsl(220, 15%, 15%); --muted: hsl(220, 8%, 50%);
    --accent: hsl(152, 69%, 29%); --card: hsl(0, 0%, 98%); --border: hsl(150, 10%, 88%);
    --c1: hsl(152, 75%, 55%); --c2: hsl(168, 70%, 50%); --c3: hsl(190, 75%, 60%);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: hsl(220, 25%, 7%); --fg: hsl(152, 30%, 96%); --muted: hsl(220, 12%, 62%);
      --accent: hsl(152, 90%, 52%); --card: hsl(220, 22%, 11%); --border: hsl(220, 18%, 22%);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 680px; margin: 0 auto; padding: 32px 20px 64px; }
  nav.crumbs { margin-bottom: 28px; }
  nav.crumbs a.brand {
    display: inline-flex; align-items: center; gap: 9px; color: var(--fg);
    text-decoration: none; font-weight: 700; font-size: 1.25rem; letter-spacing: -0.02em;
  }
  nav.crumbs svg { display: block; }
  h1 { font-size: 1.8rem; line-height: 1.25; margin: 0 0 16px; }
  a { color: var(--accent); }
  .callout {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; margin: 20px 0;
  }
  .callout p { margin: 0; }
  .store-link { font-weight: 700; }
  footer {
    margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border);
    color: var(--muted); font-size: 0.85rem;
  }
  footer nav { margin-bottom: 10px; }
  footer nav a {
    color: var(--fg); text-decoration: none; font-weight: 600; font-size: 0.9rem;
    margin-right: 20px;
  }
  footer nav a:hover { color: var(--accent); }
</style>
</head>
<body>
<main>
  <nav class="crumbs">
    <a class="brand" href="../index.html" aria-label="JoinUp home">
      <svg width="26" height="26" viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <linearGradient id="mkg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="var(--c1)"/>
            <stop offset="0.5" stop-color="var(--c2)"/>
            <stop offset="1" stop-color="var(--c3)"/>
          </linearGradient>
        </defs>
        <path fill="url(#mkg)" d="M24 3C33.4 3 41 10.6 41 20c0 9.8-10.4 19.3-15.3 23.2a2.7 2.7 0 0 1-3.4 0C17.4 39.3 7 29.8 7 20 7 10.6 14.6 3 24 3Z"/>
        <circle fill="var(--bg)" cx="24" cy="20" r="6.5"/>
      </svg>
      JoinUp
    </a>
  </nav>

  <h1>Open your invite in JoinUp</h1>
  <div class="callout">
    <!-- /** DRAFT — copy pending founder review. */ -->
    <p>This invite is in the JoinUp app. Invites can't be opened or accepted on the website — <a class="store-link" href="https://apps.apple.com/app/id6794443634">get the app</a> and your invite will be waiting.</p>
  </div>

  <footer>
    <nav aria-label="Footer">
      <a href="../index.html">Home</a>
      <a href="../support.html">Support</a>
      <a href="../privacy.html">Privacy Policy</a>
      <a href="../terms.html">Terms of Service</a>
    </nav>
    <p>JoinUp is owned and operated by Testcamp Inc. &copy; 2026 Testcamp Inc.</p>
  </footer>
</main>
</body>
</html>
